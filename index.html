<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tweet listelerim</title>
<meta property="og:title" content="Tweet listelerim">
<meta property="og:description" content="1 liste">
<style>
  :root { --bg: #f7f8f9; --card: #fff; --text: #0f1419; --muted: #5b6670; --line: #e4e7ea; --accent: #f5b400; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1013; --card: #161b20; --text: #e7e9ea; --muted: #8b98a5; --line: #2a3138; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 590px; margin: 0 auto; padding: 40px 16px 64px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; }
  .meta { color: var(--muted); }
  a { color: inherit; }
  .twitter-tweet { margin: 0 auto 16px !important; }
  blockquote.twitter-tweet { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; overflow-wrap: anywhere; }
  blockquote.twitter-tweet p { margin: 0 0 8px; }
  .lists { display: flex; flex-direction: column; gap: 10px; }
  .lists a { display: flex; justify-content: space-between; gap: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); text-decoration: none; font-weight: 600; }
  .lists a:hover { border-color: var(--accent); }
  .lists span { color: var(--muted); font-weight: 400; white-space: nowrap; }
  footer { margin-top: 32px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tweet listelerim</h1>
    <div class="meta">1 liste · 23 Ekim 2026 tarihinde güncellendi</div>
  </header>
  <nav class="lists">
    <a href="begendiklerim/">⭐ Beğendiklerim<span>4 tweet</span></a>
  </nav>
  <footer>Tweet Listem ile hazırlandı</footer>
</div>
</body>
</html>
